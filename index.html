<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e6">
<meta name="description" content="Un petit souvenir d'Isabelle & Didier — 26 Juin 2027">
<title>Isabelle & Didier — Merci</title>
<style>
:root{
  --ivoire:#f7f1e6;
  --sauge:#4f6040;
  --or:#b47a25;
  --terracotta:#b85f24;
  --fuchsia:#b32155;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:var(--ivoire)}
body{
  font-family:Georgia,"Times New Roman",serif;
  color:var(--sauge);
  overflow-x:hidden;
}
.page{
  min-height:100svh;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
}
.intro{
  min-height:100svh;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  animation:introIn 1.2s ease both;
}
.monogram{
  font-family:"Times New Roman",serif;
  font-size:clamp(52px,16vw,88px);
  line-height:1;
  letter-spacing:.02em;
  color:var(--or);
  text-shadow:0 1px 0 rgba(255,255,255,.8);
}
.intro .names{
  margin-top:12px;
  font-family:cursive;
  font-size:clamp(30px,8vw,46px);
  color:var(--sauge);
}
.intro .date{
  margin-top:10px;
  font-size:clamp(16px,4.5vw,21px);
  letter-spacing:.16em;
  color:var(--terracotta);
}
.intro .hint{
  margin-top:48px;
  font-size:14px;
  letter-spacing:.08em;
  opacity:.72;
}
.scroll-indicator{
  margin-top:28px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  color:var(--or);
  opacity:.9;
  animation:scrollFloat 1.8s ease-in-out infinite;
}
.scroll-label{
  font-family:Georgia,"Times New Roman",serif;
  font-size:12px;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.chevrons{
  display:flex;
  flex-direction:column;
  align-items:center;
  height:27px;
}
.chevrons i{
  display:block;
  width:12px;
  height:12px;
  border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;
  transform:rotate(45deg);
  margin-top:-4px;
}
.chevrons i:first-child{opacity:.42}
.chevrons i:last-child{opacity:1}
.card-section{
  width:100%;
  max-width:720px;
  padding:18px 0 46px;
}
.card{
  width:100%;
  display:block;
  border-radius:10px;
  box-shadow:0 14px 40px rgba(70,55,30,.18);
  opacity:0;
  transform:translateY(28px) scale(.985);
  animation:cardIn 1s .15s ease forwards;
}
.closing{
  width:100%;
  max-width:720px;
  text-align:center;
  padding:18px 20px 58px;
  opacity:0;
  animation:fadeIn 1s .45s ease forwards;
}
.closing-line{
  width:76px;height:1px;background:var(--or);
  margin:0 auto 22px;
}
.closing p{
  margin:8px 0;
  font-size:16px;
  line-height:1.65;
}
.closing .signature{
  margin-top:12px;
  font-family:cursive;
  font-size:32px;
  color:var(--sauge);
}
.closing .small-date{
  margin-top:8px;
  font-size:14px;
  letter-spacing:.12em;
  color:var(--terracotta);
}
footer{
  width:100%;
  text-align:center;
  padding:0 20px 28px;
  font-size:11px;
  letter-spacing:.08em;
  opacity:.48;
}

.tropical{
  position:absolute;
  width:190px;height:170px;
  pointer-events:none;
  opacity:.92;
}
.tropical.top-left{left:-48px;top:8px;transform:rotate(-8deg)}
.tropical.top-right{right:-48px;top:8px;transform:scaleX(-1) rotate(-8deg)}
.tropical.bottom-left{left:-58px;bottom:8px;transform:rotate(12deg);opacity:.55}
.tropical.bottom-right{right:-58px;bottom:8px;transform:scaleX(-1) rotate(12deg);opacity:.55}
.leaf{
  position:absolute;
  display:block;
  width:88px;height:24px;
  border-radius:100% 0 100% 0;
  background:linear-gradient(135deg,#4f6040,#75875e);
  transform-origin:right center;
  box-shadow:inset -2px -2px 0 rgba(255,255,255,.16);
}
.leaf:after{
  content:"";
  position:absolute;
  left:9px;right:7px;top:11px;
  height:1px;background:rgba(255,255,255,.38);
  transform:rotate(-8deg);
}
.top-left .l1{left:25px;top:35px;transform:rotate(-18deg)}
.top-left .l2{left:5px;top:63px;transform:rotate(-38deg) scale(.82)}
.top-left .l3{left:47px;top:76px;transform:rotate(9deg) scale(.72)}
.top-left .l4{left:0;top:100px;transform:rotate(-55deg) scale(.65)}
.top-right .l1{left:25px;top:35px;transform:rotate(-18deg)}
.top-right .l2{left:5px;top:63px;transform:rotate(-38deg) scale(.82)}
.top-right .l3{left:47px;top:76px;transform:rotate(9deg) scale(.72)}
.top-right .l4{left:0;top:100px;transform:rotate(-55deg) scale(.65)}
.bottom-left .l1{left:35px;top:45px;transform:rotate(-25deg) scale(.82)}
.bottom-left .l2{left:5px;top:75px;transform:rotate(-48deg) scale(.65)}
.bottom-left .l3{left:55px;top:82px;transform:rotate(4deg) scale(.58)}
.bottom-right .l1{left:35px;top:45px;transform:rotate(-25deg) scale(.82)}
.bottom-right .l2{left:5px;top:75px;transform:rotate(-48deg) scale(.65)}
.bottom-right .l3{left:55px;top:82px;transform:rotate(4deg) scale(.58)}
.flower{
  position:absolute;
  width:52px;height:52px;
  border-radius:50%;
  left:78px;top:19px;
  background:radial-gradient(circle at center,#f5c44e 0 9%,transparent 10%),
             radial-gradient(ellipse at 50% 15%,currentColor 0 35%,transparent 36%),
             radial-gradient(ellipse at 85% 50%,currentColor 0 35%,transparent 36%),
             radial-gradient(ellipse at 50% 85%,currentColor 0 35%,transparent 36%),
             radial-gradient(ellipse at 15% 50%,currentColor 0 35%,transparent 36%);
  filter:drop-shadow(0 4px 6px rgba(60,50,30,.12));
}
.flower.orange{color:#e87522}
.flower.fuchsia{color:#c12763}
.intro .names{margin-top:8px}
.intro .date{margin-top:8px}
.intro .hint{margin-top:30px}
@media (max-width:520px){
  .tropical{transform:scale(.82)!important}
  .tropical.top-left{left:-60px}
  .tropical.top-right{right:-60px}
  .tropical.bottom-left{left:-70px}
  .tropical.bottom-right{right:-70px}
}

@keyframes introIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}
@keyframes cardIn{
  to{opacity:1;transform:none}
}
@keyframes fadeIn{
  to{opacity:1}
}
@keyframes scrollFloat{
  0%,100%{transform:translateY(0);opacity:.68}
  50%{transform:translateY(6px);opacity:1}
}
@media (min-width:700px){
  .page{padding-left:24px;padding-right:24px}
  .card-section{padding-top:30px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
<body>
<main class="page">
  <section class="intro" aria-label="Introduction">
    <div class="tropical top-left" aria-hidden="true">
      <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span>
      <span class="leaf l4"></span><span class="flower orange"></span>
    </div>
    <div class="tropical top-right" aria-hidden="true">
      <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span>
      <span class="leaf l4"></span><span class="flower fuchsia"></span>
    </div>
    <div class="tropical bottom-left" aria-hidden="true">
      <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span>
    </div>
    <div class="tropical bottom-right" aria-hidden="true">
      <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span>
    </div>
    <div class="monogram" aria-hidden="true">I&nbsp;&amp;&nbsp;D</div>
    <div class="names">Isabelle &amp; Didier</div>
    <div class="date">26 JUIN 2027</div>
    <div class="hint">Un petit souvenir de notre journée…</div>
    <div class="scroll-indicator" aria-hidden="true">
      <span class="scroll-label">Faites défiler</span>
      <span class="chevrons"><i></i><i></i></span>
    </div>
  </section>

  <section class="card-section" aria-label="Carte de remerciement">
    <img
      class="card"
      src="assets/carte-remerciement.png"
      alt="Carte de remerciement d'Isabelle et Didier pour les invités du vin d'honneur"
      loading="eager"
    >
  </section>

  <section class="closing" aria-label="Signature">
    <div class="closing-line"></div>
    <p>Merci encore d’avoir partagé avec nous<br>ces précieux instants.</p>
    <div class="signature">Isabelle &amp; Didier</div>
    <div class="small-date">26 JUIN 2027</div>
  </section>

  <footer>Avec toute notre affection ♡</footer>
</main>
</body>
</html>
