<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fcf6ec">
<meta name="description" content="Un petit souvenir d'Isabelle & Didier — 26 Juin 2027">
<title>Isabelle & Didier — Merci</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  /* Ivoire = couleur de fond exacte de la carte, pour un raccord invisible */
  --ivoire:#fcf6ec;
  --sauge:#4f6040;
  --sauge-fonce:#3b4a2b;
  --or:#b47a25;
  --terracotta:#b85f24;
  --fuchsia:#b32155;
  --script:"Great Vibes","Snell Roundhand","Segoe Script","Brush Script MT",cursive;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;min-height:100%;background:var(--ivoire)}
body{
  font-family:var(--serif);
  color:var(--sauge-fonce);
  overflow-x:hidden;
}
.page{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* ───────────── ACCUEIL ───────────── */
.intro{
  position:relative;
  width:100%;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 110px) 22px calc(env(safe-area-inset-bottom) + 120px);
}
.intro-content{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.rise{
  opacity:0;
  animation:rise 1s cubic-bezier(.2,.7,.2,1) forwards;
  animation-delay:var(--d,0s);
}
.medallion{
  width:88px;height:88px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  padding-bottom:4px;
  font-family:var(--script);
  font-size:40px;
  line-height:1;
  color:var(--or);
  border:1px solid rgba(180,122,37,.75);
  box-shadow:0 0 0 5px var(--ivoire),0 0 0 6px rgba(180,122,37,.35);
}
.names{
  margin:30px 0 0;
  font-family:var(--script);
  font-weight:400;
  font-size:clamp(54px,17vw,88px);
  line-height:1.02;
  color:var(--sauge-fonce);
}
.names span{display:block}
.names .amp{display:inline;color:var(--or);font-size:.82em;padding-right:.12em}
.ornament{
  display:flex;
  align-items:center;
  gap:12px;
  color:var(--or);
}
.ornament span{
  display:block;
  width:min(24vw,96px);
  height:1px;
  background:linear-gradient(90deg,transparent,var(--or));
}
.ornament span:last-child{transform:scaleX(-1)}
.ornament svg{flex:none}
.intro .ornament{margin:22px 0 16px}
.date{
  font-size:clamp(18px,5vw,24px);
  font-weight:600;
  letter-spacing:.24em;
  padding-left:.24em; /* compense l'espace ajouté après la dernière lettre */
  color:var(--terracotta);
}
.hint{
  margin:26px 0 0;
  font-size:clamp(19px,5.2vw,23px);
  font-style:italic;
  font-weight:500;
  color:var(--sauge);
  opacity:.9;
}
.scroll-indicator{
  margin-top:34px;
  display:block;
  color:var(--or);
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.scroll-indicator .float{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  animation:scrollFloat 1.8s ease-in-out infinite;
}
.scroll-label{
  font-size:13px;
  font-weight:600;
  letter-spacing:.2em;
  padding-left:.2em;
  text-transform:uppercase;
}
.chevrons{display:flex;flex-direction:column;align-items:center;height:27px}
.chevrons i{
  display:block;
  width:12px;height:12px;
  border-right:2px solid currentColor;
  border-bottom:2px solid currentColor;
  transform:rotate(45deg);
  margin-top:-4px;
}
.chevrons i:first-child{opacity:.4}

/* Décors : les vraies illustrations de la carte, qui se balancent doucement */
.deco{
  position:absolute;
  z-index:1;
  height:auto;
  opacity:0;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
  will-change:transform;
}
.deco-tl{top:0;left:0;width:min(58vw,320px);transform-origin:0 0;
  animation:decoIn 1.6s .1s ease forwards,swayL 8s 1.7s ease-in-out infinite alternate}
.deco-tr{top:0;right:0;width:min(46vw,260px);transform-origin:100% 0;
  animation:decoIn 1.6s .25s ease forwards,swayR 9s 1.85s ease-in-out infinite alternate}
.deco-br{bottom:0;right:0;width:min(58vw,380px);transform-origin:100% 100%;
  animation:decoIn 1.6s .4s ease forwards,swayR 10s 2s ease-in-out infinite alternate}
.deco-bl{bottom:0;left:0;width:min(42vw,290px);transform:scaleX(-1);transform-origin:0 100%;
  animation:decoIn 1.6s .55s ease forwards,swayBL 9s 2.15s ease-in-out infinite alternate}

/* ───────────── CARTE ───────────── */
.card-section{
  width:100%;
  max-width:720px;
  padding:8px 14px 30px;
  scroll-margin-top:8px;
}
.reveal{
  opacity:0;
  transform:translateY(24px);
  transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1);
}
.reveal.is-visible{opacity:1;transform:none}
.card-wrap{
  position:relative;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 14px 40px rgba(70,55,30,.18);
  transform:translateY(34px) scale(.985);
}
.card-wrap.is-visible{transform:none}
.card{display:block;width:100%;height:auto}

/* Tortue : petite animation superposée à la carte (mêmes proportions que l'image d'origine) */
.turtle-slot{
  position:absolute;
  left:0;
  top:85.646%;      /* 1432 / 1672 */
  width:43.996%;    /* 414 / 941 */
  aspect-ratio:414/240;
  pointer-events:none;
}
.turtle-slot img{display:block;width:100%;height:100%}

/* ───────────── MOT DE FIN ───────────── */
.closing{
  width:100%;
  max-width:720px;
  text-align:center;
  padding:14px 20px calc(env(safe-area-inset-bottom) + 64px);
}
.closing .ornament{justify-content:center;margin:0 0 20px}
.closing p{
  margin:0;
  font-size:clamp(20px,5.4vw,24px);
  font-style:italic;
  font-weight:500;
  line-height:1.6;
  color:var(--sauge);
}

/* ───────────── ANIMATIONS ───────────── */
@keyframes rise{
  from{opacity:0;transform:translateY(14px)}
  to{opacity:1;transform:none}
}
@keyframes decoIn{to{opacity:1}}
@keyframes swayL{from{transform:rotate(-1deg)}to{transform:rotate(1.3deg)}}
@keyframes swayR{from{transform:rotate(1deg)}to{transform:rotate(-1.3deg)}}
@keyframes swayBL{from{transform:scaleX(-1) rotate(-1deg)}to{transform:scaleX(-1) rotate(1.2deg)}}
@keyframes scrollFloat{
  0%,100%{transform:translateY(0);opacity:.7}
  50%{transform:translateY(6px);opacity:1}
}

@media (min-width:700px){
  .card-section{padding-top:24px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rise,.deco{animation:none!important;opacity:1!important;transform:none!important}
  .deco-bl{transform:scaleX(-1)!important}
  .scroll-indicator .float{animation:none}
  .reveal,.card-wrap{transition:none;opacity:1;transform:none}
  .turtle-slot{display:none}
}
</style>
<noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
</head>
<body>
<main class="page">

  <section class="intro" aria-label="Introduction">
    <img class="deco deco-tl" src="assets/deco-haut-gauche.webp" alt="" aria-hidden="true" width="430" height="540" decoding="async">
    <img class="deco deco-tr" src="assets/deco-haut-droite.webp" alt="" aria-hidden="true" width="351" height="292" decoding="async">
    <img class="deco deco-bl" src="assets/deco-bas.webp" alt="" aria-hidden="true" width="481" height="172" decoding="async">
    <img class="deco deco-br" src="assets/deco-bas.webp" alt="" aria-hidden="true" width="481" height="172" decoding="async">

    <div class="intro-content">
      <div class="medallion rise" style="--d:.15s" aria-hidden="true">I&nbsp;&amp;&nbsp;D</div>

      <h1 class="names rise" style="--d:.35s">
        <span>Isabelle</span>
        <span><span class="amp">&amp;</span> Didier</span>
      </h1>

      <div class="ornament rise" style="--d:.6s" aria-hidden="true">
        <span></span>
        <svg width="22" height="20" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 20.5S2.5 14.8 2.5 8.2A5 5 0 0 1 12 5.6a5 5 0 0 1 9.5 2.6c0 6.6-9.5 12.3-9.5 12.3z"/></svg>
        <span></span>
      </div>

      <div class="date rise" style="--d:.75s">26 JUIN 2027</div>
      <p class="hint rise" style="--d:.95s">Un petit souvenir de notre journée…</p>

      <a class="scroll-indicator rise" style="--d:1.2s" href="#carte" aria-label="Découvrir la carte de remerciement">
        <span class="float">
          <span class="scroll-label">Faites défiler</span>
          <span class="chevrons" aria-hidden="true"><i></i><i></i></span>
        </span>
      </a>
    </div>
  </section>

  <section class="card-section" id="carte" aria-label="Carte de remerciement">
    <div class="card-wrap reveal">
      <img
        class="card"
        src="assets/carte-remerciement.png"
        width="941" height="1672"
        alt="Carte de remerciement d'Isabelle et Didier pour les invités du vin d'honneur"
        loading="eager"
      >
      <div class="turtle-slot" id="turtleSlot" aria-hidden="true">
        <img id="turtle" data-src="assets/tortue-animee.webp" alt="" width="414" height="240" decoding="async">
      </div>
    </div>
  </section>

  <section class="closing reveal" aria-label="Mot de fin">
    <div class="ornament" aria-hidden="true">
      <span></span>
      <svg width="22" height="20" viewBox="0 0 24 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 20.5S2.5 14.8 2.5 8.2A5 5 0 0 1 12 5.6a5 5 0 0 1 9.5 2.6c0 6.6-9.5 12.3-9.5 12.3z"/></svg>
      <span></span>
    </div>
    <p>Merci encore d’avoir partagé avec nous<br>ces précieux instants.</p>
  </section>

</main>

<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var reveals = document.querySelectorAll('.reveal');
  var turtle = document.getElementById('turtle');
  var slot = document.getElementById('turtleSlot');

  function show(el){ el.classList.add('is-visible'); }
  function startTurtle(){ if (turtle && !turtle.getAttribute('src')) turtle.src = turtle.getAttribute('data-src'); }

  /* Sans IntersectionObserver (très vieux navigateurs) : on affiche tout directement */
  if (!('IntersectionObserver' in window)) {
    for (var i = 0; i < reveals.length; i++) show(reveals[i]);
    if (!reduce) startTurtle();
    return;
  }

  /* 1. La carte et le mot de fin apparaissent quand l'invité arrive dessus */
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) { show(e.target); io.unobserve(e.target); }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  for (var j = 0; j < reveals.length; j++) io.observe(reveals[j]);

  /* 2. La tortue démarre quand elle entre à l'écran (fichier préchargé après le chargement de la page) */
  if (turtle && slot && !reduce) {
    window.addEventListener('load', function(){ new Image().src = turtle.getAttribute('data-src'); });
    var to = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { startTurtle(); to.disconnect(); }
      });
    }, { threshold: 0.3 });
    to.observe(slot);
  }
})();
</script>
</body>
</html>
